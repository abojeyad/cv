<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>السيرة الذاتية | أنس أحمد محمد</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- شريط الأدوات: تبديل اللغة وتحميل PDF (لا يظهر في الطباعة) -->
    <nav class="toolbar">
        <button id="switch-lang" class="btn" type="button"></button>
        <a id="download" class="btn btn-primary" download><i class="fas fa-download"></i> <span></span></a>
    </nav>

    <div class="page">

        <!-- الترويسة: الصورة والمعلومات بجانبها -->
        <header class="hero">
            <div class="photo-frame">
                <img src="profile.jpeg" alt="" id="photo" class="photo">
            </div>
            <div class="hero-body">
                <h1 id="name" class="name"></h1>
                <p id="tagline" class="tagline"></p>
                <p id="summary" class="summary"></p>
                <div id="personal-info" class="info-grid"></div>
            </div>
        </header>

        <section class="section">
            <h2 class="section-title"><span class="num">01</span> <span data-label="experience"></span></h2>
            <div id="experience" class="timeline"></div>
        </section>

        <section class="section">
            <h2 class="section-title"><span class="num">02</span> <span data-label="previous"></span></h2>
            <div id="previous" class="prev-list"></div>
        </section>

        <section class="section">
            <h2 class="section-title"><span class="num">03</span> <span data-label="scientific"></span></h2>
            <div id="scientific-skills" class="skill-grid"></div>
        </section>

        <section class="section">
            <h2 class="section-title"><span class="num">04</span> <span data-label="tools"></span></h2>
            <div id="tools-apps" class="tool-groups"></div>
        </section>

        <div class="trio">
            <section class="section">
                <h2 class="section-title"><span class="num">05</span> <span data-label="traits"></span></h2>
                <ul id="personal-traits" class="check-list"></ul>
            </section>

            <section class="section">
                <h2 class="section-title"><span class="num">06</span> <span data-label="development"></span></h2>
                <p id="development" class="plain"></p>
            </section>

            <section class="section">
                <h2 class="section-title"><span class="num">07</span> <span data-label="languages"></span></h2>
                <ul id="languages" class="lang-list"></ul>
            </section>
        </div>

        <footer class="footer">
            <span data-label="updated"></span> <span id="last-update"></span>
        </footer>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
